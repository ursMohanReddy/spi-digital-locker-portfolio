<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPI Digital Locker — Team 13 | KLE Tech EE-VDT Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Institutional Header -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="menuToggle" class="icon-btn mobile-only" aria-label="Toggle Sidebar">☰</button>
      <div class="brand-mark">
        <span class="brand-badge">KLE</span>
        <div class="brand-text">
          <div class="brand-title">KLE Technological University <span class="muted">· EE-VDT</span></div>
          <div class="brand-sub">SPI-Based 4-Bit Digital Locker · Team 13</div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <button id="searchTrigger" class="search-pill" title="Quick Search (Ctrl+K)">
        <span>Search pages, FRs, decisions…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span class="review-pill" id="activeReviewPill">Review 2 · Active</span>
      <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <!-- Main Workspace Shell -->
  <div class="app-shell">
    <!-- Persistent Dark-Slate Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-label">PORTFOLIO NAVIGATION</span>
        <span class="sidebar-progress-chip" id="sidebarProgressChip">10 / 16 Active</span>
      </div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="site-code">vdt-mp-2026-SPI-team13</div>
        <div class="site-note">Verilog HDL · Dual FPGA · Vivado</div>
      </div>
    </aside>

    <!-- Dynamic Page Content -->
    <main class="main-content" id="mainContent" tabindex="-1"></main>
  </div>

  <!-- Ctrl+K Quick Command Palette Modal -->
  <div id="cmdModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="cmd-box">
      <div class="cmd-input-row">
        <span class="cmd-icon">⌘</span>
        <input type="text" id="cmdInput" placeholder="Jump to any page, FR, decision card, or risk..." autocomplete="off" />
        <button id="cmdClose" class="icon-btn">✕</button>
      </div>
      <div id="cmdResults" class="cmd-results"></div>
    </div>
  </div>

  <!-- Lightbox Modal for Schematics & Waveforms -->
  <div id="lightbox" class="modal-backdrop hidden">
    <div class="lightbox-inner">
      <button id="lightboxClose" class="lightbox-close">✕</button>
      <img id="lightboxImg" src="" alt="Enlarged figure" />
      <p id="lightboxCaption"></p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
